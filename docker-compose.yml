services:
  php:
    container_name: php
    image: yiisoftware/yii2-php:8.4-apache
    volumes:
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      - ./:/app:delegated
    ports:
      - '8000:80'
    networks:
      - app-network
    
  mysql:
    container_name: mysql
    image: mysql
    command: [ 'mysqld',
               '--disable-log-bin',
               '--skip-log-bin',
               '--binlog-expire-logs-seconds=259200'
    ]
    environment:
      MYSQL_DATABASE: ${DOCKER_MYSQL_NAME}
      MYSQL_USER: ${DOCKER_MYSQL_USER}
      MYSQL_PASSWORD: ${DOCKER_MYSQL_PASWORD}
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASWORD}
    ports:
      - '3306:3306'
    volumes:
      - ./docker/mysql:/var/lib/mysql
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge
